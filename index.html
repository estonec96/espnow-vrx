<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Встановлення прошивки ESPNOW TO VRX2G7</title>
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        text-align: center; 
        margin-top: 60px; 
        background-color: #f4f4f9;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h1 { font-size: 24px; margin-bottom: 10px; }
      p { color: #666; margin-bottom: 25px; }
      esp-web-install-button {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Встановлення прошивки ESPNOW TO VRX2G7</h1>
      <p>Підключіть вашу плату ESP32-C3 по кабелю USB до комп'ютера та натисніть кнопку нижче.</p>
      
      <!-- Скрипт ESP Web Tools -->
      <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
      
      <!-- Кнопка прошивки, що звертається до файлу manifest.json -->
      <esp-web-install-button manifest="manifest.json">
        <button slot="activate">Встановити прошивку</button>
      </esp-web-install-button>
    </div>
  </body>
</html>
